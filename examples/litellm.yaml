model_list:
  - model_name: company-gpt
    litellm_params:
      model: openai/company-gpt
      api_base: https://internal.example.com/v1
      api_key: os.environ/COMPANY_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120
